<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #f4f6f3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; position: relative; overflow: hidden;
  }
  .wash { position: absolute; inset: 0;
    background: radial-gradient(820px 480px at 80% 28%, #0f9d6b22, transparent 70%),
                radial-gradient(620px 460px at 0% 100%, #0f9d6b12, transparent 70%); }
  .pad { position: absolute; inset: 0; padding: 54px 58px; display: flex; }
  .left { width: 660px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 28px; }
  .brand svg { width: 46px; height: 46px; filter: drop-shadow(0 6px 15px #0f9d6b33); }
  .brand .name { font-size: 27px; font-weight: 720; letter-spacing: -.02em; color: #14170f; }
  .head { font-size: 72px; font-weight: 760; line-height: 1.02; letter-spacing: -.035em; color: #14170f; }
  .head .g { color: #0f9d6b; }
  .sub { margin-top: 20px; font-size: 23px; font-weight: 560; color: #55605a; letter-spacing: -.01em; }
  .foot { margin-top: auto; font-size: 16px; font-weight: 650; letter-spacing: .04em; color: #7d867d; text-transform: uppercase; }
  .right { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-left: 22px; }
  .card { background: #fff; border: 1px solid #e6e9e3; border-radius: 15px;
    box-shadow: 0 12px 30px #1a2b1f14; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .tick { width: 27px; height: 27px; border-radius: 50%; background: #0f9d6b; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; font-weight: 800; }
  .card .t { font-size: 18px; font-weight: 650; color: #1c2119; letter-spacing: -.01em; }
  .card.run .tick { background: #e8b23a; }
  .spin { width: 14px; height: 14px; border: 3px solid #fff; border-top-color: transparent; border-radius: 50%; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="pad">
    <div class="left">
      <div class="brand">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ug" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0f9d6b"/><stop offset="1" stop-color="#37c795"/>
            </linearGradient>
            <mask id="ko"><rect width="512" height="512" fill="white"/>
              <rect x="99" y="144" width="266" height="266" rx="76" fill="black"/></mask>
          </defs>
          <rect width="512" height="512" rx="116" fill="url(#ug)"/>
          <rect x="158" y="107" width="224" height="224" rx="52" fill="#FFFFFF" mask="url(#ko)"/>
          <rect x="120" y="165" width="224" height="224" rx="52" fill="#FFFFFF"/>
        </svg>
        <span class="name">Understudy</span>
      </div>
      <div class="head">It does the work<br/><span class="g">while you talk.</span></div>
      <div class="sub">A live meeting agent that acts, not just notes.</div>
      <div class="foot">Gemini 3.5 · Google ADK · Vertex AI</div>
    </div>
    <div class="right">
      <div class="card"><span class="tick">&#10003;</span><span class="t">Opened a real GitHub PR</span></div>
      <div class="card"><span class="tick">&#10003;</span><span class="t">Filed a Plane ticket</span></div>
      <div class="card run"><span class="tick"><span class="spin"></span></span><span class="t">Researching, live sources...</span></div>
    </div>
  </div>
</body>
</html>
