<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; }
  body {
    background: #f6f7f4;
    color: #191c18;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  /* subtle brand wash */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(1200px 600px at 50% 34%, #0f9d6b12, transparent 70%);
  }
  .wrap { position: relative; text-align: center; }
  .mark { width: 150px; height: 150px; margin: 0 auto 34px; display: block;
          filter: drop-shadow(0 12px 30px #0f9d6b30); }
  .name {
    font-size: 104px; font-weight: 720; letter-spacing: -0.035em; line-height: 1;
    color: #191c18;
  }
  .rule { width: 64px; height: 4px; border-radius: 2px; background: #0f9d6b;
          margin: 30px auto 28px; }
  .tag {
    font-size: 34px; font-weight: 500; color: #61665d; letter-spacing: -0.01em;
  }
  .tag b { color: #191c18; font-weight: 680; }
  .foot {
    position: absolute; bottom: 56px; left: 0; right: 0; text-align: center;
    font-size: 20px; letter-spacing: .14em; text-transform: uppercase;
    color: #9aa093; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ug" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0f9d6b"/><stop offset="1" stop-color="#37c795"/>
        </linearGradient>
        <mask id="ko"><rect width="512" height="512" fill="white"/>
          <rect x="99" y="144" width="266" height="266" rx="76" fill="black"/></mask>
      </defs>
      <rect width="512" height="512" rx="116" fill="url(#ug)"/>
      <rect x="158" y="107" width="224" height="224" rx="52" fill="#FFFFFF" mask="url(#ko)"/>
      <rect x="120" y="165" width="224" height="224" rx="52" fill="#FFFFFF"/>
    </svg>
    <div class="name">Understudy</div>
    <div class="rule"></div>
    <div class="tag">A live meeting agent that <b>acts</b> — not just notes.</div>
  </div>
  <div class="foot">Google ADK · Gemini · Vertex AI</div>
</body>
</html>
