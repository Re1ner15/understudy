<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9d6b"/><stop offset="1" stop-color="#37c795"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1180" fill="#f7f8f7"/>

  <!-- Title -->
  <text x="40" y="48" font-size="30" font-weight="700" fill="#0b0b0f">Understudy Architecture</text>
  <text x="40" y="74" font-size="14" fill="#5b6b63">Live meeting agent · Gemini 3.5 Flash + Gemma + Google ADK on Google Cloud · audio stays on-device</text>

  <!-- between-band arrows -->
  <g stroke="#111827" stroke-width="2" marker-end="url(#arrow)">
    <line x1="600" y1="252" x2="600" y2="276"/>
    <line x1="600" y1="442" x2="600" y2="466"/>
    <line x1="600" y1="662" x2="600" y2="686"/>
    <line x1="600" y1="852" x2="600" y2="876"/>
  </g>

  <!-- ===== Band A: Capture ===== -->
  <rect x="40" y="92" width="1120" height="158" rx="14" fill="#ffffff" stroke="#dfe5e1"/>
  <text x="64" y="130" font-size="15" font-weight="700" fill="#0f9d6b">1 · CAPTURE</text>
  <text x="64" y="152" font-size="11" fill="#5b6b63">on your Mac</text>
  <text x="64" y="167" font-size="11" fill="#5b6b63">(local, no cloud)</text>
  <g font-size="12.5" fill="#0b0b0f" text-anchor="middle">
    <rect x="300" y="120" width="180" height="52" rx="10" fill="#eef6f2" stroke="#cfe6db"/>
    <text x="390" y="150">Microphone</text>
    <rect x="510" y="120" width="250" height="52" rx="10" fill="#eef6f2" stroke="#cfe6db"/>
    <text x="635" y="143">Listener</text><text x="635" y="160" font-size="11" fill="#5b6b63">VAD + faster-whisper</text>
    <rect x="790" y="120" width="250" height="52" rx="10" fill="#eef6f2" stroke="#cfe6db"/>
    <text x="915" y="143">Screen-watcher</text><text x="915" y="160" font-size="11" fill="#5b6b63">changed frames only</text>
  </g>
  <text x="300" y="205" font-size="11.5" font-style="italic" fill="#0f9d6b">Audio never leaves the device. Only transcript text and screen context go onward (HTTPS).</text>

  <!-- ===== Band B: Understand ===== -->
  <rect x="40" y="282" width="1120" height="160" rx="14" fill="#ffffff" stroke="#dfe5e1"/>
  <text x="64" y="320" font-size="15" font-weight="700" fill="#0f9d6b">2 · UNDERSTAND</text>
  <text x="64" y="342" font-size="11" fill="#5b6b63">Cloud Run</text>
  <text x="64" y="357" font-size="11" fill="#5b6b63">FastAPI + Google ADK</text>
  <g font-size="12.5" fill="#0b0b0f" text-anchor="middle">
    <rect x="300" y="312" width="190" height="52" rx="10" fill="#f1eefb" stroke="#ddd3f2"/>
    <text x="395" y="335">Gemma filter</text><text x="395" y="352" font-size="11" fill="#5b6b63">opt-in · drops non-commitments</text>
    <rect x="520" y="312" width="220" height="52" rx="10" fill="#f1eefb" stroke="#ddd3f2"/>
    <text x="630" y="335">Watcher agent</text><text x="630" y="352" font-size="11" fill="#5b6b63">transcript to action items</text>
    <rect x="770" y="312" width="270" height="52" rx="10" fill="#f1eefb" stroke="#ddd3f2"/>
    <text x="905" y="335">Cross-meeting memory</text><text x="905" y="352" font-size="11" fill="#5b6b63">Vertex embeddings recall</text>
  </g>
  <text x="300" y="398" font-size="11.5" font-style="italic" fill="#5b6b63">Powered by Vertex AI: Gemini 3.5 Flash (reasoning + multimodal) and text-embedding-005 (memory).</text>
  <g font-size="12.5" fill="#0b0b0f" text-anchor="middle" stroke="#111827" stroke-width="0"/>
  <line x1="300" y1="416" x2="1040" y2="416" stroke="#eef0ee"/>

  <!-- ===== Band C: Act ===== -->
  <rect x="40" y="472" width="1120" height="190" rx="14" fill="#ffffff" stroke="#dfe5e1"/>
  <text x="64" y="510" font-size="15" font-weight="700" fill="#0f9d6b">3 · ACT</text>
  <text x="64" y="530" font-size="11" fill="#5b6b63">Orchestrator</text>
  <text x="64" y="545" font-size="11" fill="#5b6b63">parallel fan-out</text>
  <g font-size="11.5" fill="#0b0b0f" text-anchor="middle">
    <rect x="286" y="500" width="112" height="46" rx="9" fill="url(#emerald)"/><text x="342" y="528" fill="#fff">Email</text>
    <rect x="408" y="500" width="112" height="46" rx="9" fill="url(#emerald)"/><text x="464" y="528" fill="#fff">Calendar</text>
    <rect x="530" y="500" width="112" height="46" rx="9" fill="url(#emerald)"/><text x="586" y="528" fill="#fff">Doc</text>
    <rect x="652" y="500" width="112" height="46" rx="9" fill="url(#emerald)"/><text x="708" y="528" fill="#fff">Research</text>
    <rect x="774" y="500" width="112" height="46" rx="9" fill="url(#emerald)"/><text x="830" y="528" fill="#fff">Slack</text>
    <rect x="896" y="500" width="112" height="46" rx="9" fill="url(#emerald)"/><text x="952" y="528" fill="#fff">Task</text>
    <rect x="1018" y="500" width="112" height="46" rx="9" fill="url(#emerald)"/><text x="1074" y="528" fill="#fff">Code</text>
  </g>
  <text x="286" y="588" font-size="12" fill="#0b0b0f">Real side effects (env-gated): Gmail send · Google Calendar · Google Doc · Slack · GitHub issue + draft PR · Plane ticket.</text>
  <text x="286" y="612" font-size="12" fill="#0b0b0f">Model Armor style guardrail (PII + prompt-injection) gates irreversible actions, which then wait on one-tap approval.</text>
  <text x="286" y="636" font-size="11.5" font-style="italic" fill="#5b6b63">Reversible actions fire immediately, in parallel, while the meeting is still going.</text>

  <!-- ===== Band D: Persist + follow through ===== -->
  <rect x="40" y="692" width="1120" height="160" rx="14" fill="#ffffff" stroke="#dfe5e1"/>
  <text x="64" y="730" font-size="15" font-weight="700" fill="#0f9d6b">4 · PERSIST +</text>
  <text x="64" y="748" font-size="15" font-weight="700" fill="#0f9d6b">FOLLOW THROUGH</text>
  <g font-size="12.5" fill="#0b0b0f" text-anchor="middle">
    <rect x="300" y="726" width="300" height="56" rx="10" fill="#fff7e6" stroke="#f2e3bf"/>
    <text x="450" y="750">Firestore</text><text x="450" y="768" font-size="11" fill="#5b6b63">ledger · state · audit · memory</text>
    <rect x="628" y="726" width="290" height="56" rx="10" fill="#eef6f2" stroke="#cfe6db"/>
    <text x="773" y="750">Cloud Scheduler + scanner</text><text x="773" y="768" font-size="11" fill="#5b6b63">nudge · escalate overdue</text>
    <rect x="946" y="726" width="200" height="56" rx="10" fill="#eef6f2" stroke="#cfe6db"/>
    <text x="1046" y="750">Reasoning traces</text><text x="1046" y="768" font-size="11" fill="#5b6b63">OpenTelemetry-style</text>
  </g>
  <text x="300" y="820" font-size="11.5" font-style="italic" fill="#5b6b63">Every commitment is tracked to completion across days; every step is one auditable reasoning chain.</text>

  <!-- ===== Band E: Surfaces ===== -->
  <rect x="40" y="882" width="1120" height="150" rx="14" fill="#ffffff" stroke="#dfe5e1"/>
  <text x="64" y="920" font-size="15" font-weight="700" fill="#0f9d6b">5 · SURFACES</text>
  <text x="64" y="942" font-size="11" fill="#5b6b63">realtime</text>
  <text x="64" y="957" font-size="11" fill="#5b6b63">via onSnapshot</text>
  <g font-size="12.5" fill="#0b0b0f" text-anchor="middle">
    <rect x="300" y="916" width="320" height="56" rx="10" fill="#f1eefb" stroke="#ddd3f2"/>
    <text x="460" y="940">Web Dashboard</text><text x="460" y="958" font-size="11" fill="#5b6b63">live · commitments · minutes · audit</text>
    <rect x="648" y="916" width="220" height="56" rx="10" fill="#f1eefb" stroke="#ddd3f2"/>
    <text x="758" y="940">Companion</text><text x="758" y="958" font-size="11" fill="#5b6b63">always-on-top widget</text>
    <rect x="896" y="916" width="240" height="56" rx="10" fill="#f1eefb" stroke="#ddd3f2"/>
    <text x="1016" y="940">Slack</text><text x="1016" y="958" font-size="11" fill="#5b6b63">feed · approvals · nudges</text>
  </g>
  <text x="300" y="1010" font-size="11.5" font-style="italic" fill="#0f9d6b">By the time you say goodbye, the work is already done.</text>
</svg>
